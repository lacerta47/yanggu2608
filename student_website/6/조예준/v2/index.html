<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌋 화산시대 공룡 달리기 (v2)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <!-- 게임 상단 정보바 -->
    <header class="game-header">
      <h1 class="game-title">🌋 화산시대 공룡 달리기</h1>
      <div class="status-bar">
        <div class="status-item">
          <span class="status-label">🏆 최고 점수</span>
          <span id="highScoreText" class="status-value">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">⭐ 점수</span>
          <span id="scoreText" class="status-value">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">⚡ 속도</span>
          <span id="speedText" class="status-value">1.0x</span>
        </div>
      </div>
    </header>

    <!-- 게임 화면 캔버스 -->
    <main class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="400"></canvas>

      <!-- 모바일 점프 조작 버튼 -->
      <div class="mobile-controls">
        <button id="btnJump" class="jump-btn">🚀 펄쩍 점프하기! (스페이스바)</button>
      </div>
    </main>

    <!-- 게임 가이드 & 설명 -->
    <footer class="game-footer">
      <p class="guide-text">💡 <strong>조작법:</strong> <code>스페이스바</code> 키 또는 <code>화면 클릭/점프 버튼</code>으로 공룡을 점프시켜 장애물을 피하세요!</p>
    </footer>

    <!-- 시작 / 게임 오버 모달 팝업 -->
    <div id="gameModal" class="modal-overlay">
      <div class="modal-content">
        <h2 id="modalTitle" class="modal-title">🌋 화산시대 공룡 달리기</h2>
        <p id="modalMessage" class="modal-message">용암과 화산 돌을 피해 달리고 점수를 모으세요!\n시간이 지나면 공룡이 점점 더 빠르게 달려요!</p>
        <button id="modalBtn" class="action-btn">게임 시작하기!</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
