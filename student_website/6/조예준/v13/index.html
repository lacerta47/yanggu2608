<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌋 화산시대 공룡 달리기 (v13 - 10단계 레벨 도전!)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <!-- 상단 정보바 -->
    <header class="game-header">
      <h1 class="game-title">🌋 화산시대 공룡 달리기</h1>
      <div class="status-bar">
        <div class="status-item">
          <span class="status-label">🚩 레벨</span>
          <span id="levelText" class="status-value">1 / 10</span>
        </div>
        <div class="status-item">
          <span class="status-label">🏆 최고</span>
          <span id="highScoreText" class="status-value">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">⭐ 점수</span>
          <span id="scoreText" class="status-value">0</span>
        </div>
      </div>
    </header>

    <!-- 게임 화면 캔버스 -->
    <main class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="400"></canvas>

      <!-- 모바일 조작 버튼 -->
      <div class="mobile-controls">
        <button id="btnDuck" class="duck-btn">🙇‍♂️ 숙이기 (아래 화살표)</button>
        <button id="btnJump" class="jump-btn">🚀 펄쩍 점프! (스페이스바)</button>
      </div>
    </main>

    <!-- 조작 가이드 -->
    <footer class="game-footer">
      <p class="guide-text">
        💡 <strong>10단계 레벨:</strong> 100점마다 다음 단계로 레벨업! 10단계까지 모두 정복해 보세요!
      </p>
    </footer>

    <!-- 시작 / 게임 오버 / 10단계 승리 모달 -->
    <div id="gameModal" class="modal-overlay">
      <div class="modal-content">
        <h2 id="modalTitle" class="modal-title">🌋 화산시대 공룡 달리기</h2>
        <p id="modalMessage" class="modal-message">1단계부터 10단계까지 점점 빨라지고 장애물이 다양해져요!\n10단계를 클리어해 우주 최고의 공룡이 되어보세요!</p>
        <button id="modalBtn" class="action-btn">게임 시작하기!</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
