<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>싱싱한 과일 쌓기 - v8 (11단계 & 관리자 비밀권)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        
        <!-- 1. 홈 화면 (단계 선택 없이 바로 시작!) -->
        <div id="homeScreen" class="screen active">
            <div class="home-card">
                <div class="title-badge">🍉 1~11단계 연속 도전 모드</div>
                <h1 class="main-title">싱싱한 과일 쌓기</h1>
                <p class="sub-title">시간 제한 없이 1단계부터 전설의 11단계 수박왕까지 순서대로 도전해요!</p>

                <div class="glass-preview-box">
                    <span class="preview-emoji">🍒 🍓 🫐 🍊 🍈 🍉</span>
                </div>

                <div class="home-btn-group">
                    <button id="homeStartBtn" class="btn primary-btn">게임 시작하기 🚀</button>
                    <!-- 🔑 관리자 전용 건너뛰기 버튼 -->
                    <button id="openAdminBtn" class="btn admin-btn">🔑 관리자 비밀권</button>
                </div>
            </div>
        </div>

        <!-- 2. 스테이지 게임 진행 화면 (시간초 없음, 1~11단계 연속) -->
        <div id="gamePlayScreen" class="screen">
            <header class="game-header">
                <div class="header-left">
                    <span id="currentStageText" class="badge">1단계 / 11단계</span>
                    <span id="targetFruitText" class="target-badge">목표: 라즈베리 🫐</span>
                </div>
                <div class="header-right">
                    <div class="stat-box">
                        <span class="stat-label">⭐ 점수</span>
                        <span id="scoreText" class="stat-value">0</span>
                    </div>
                </div>
            </header>

            <!-- 다음에 떨어질 과일 및 건너뛰기 퀵버튼 -->
            <div class="next-fruit-bar">
                <span>다음 과일: <strong id="nextFruitDisplay" class="next-fruit-icon">🍒 앵두</strong></span>
                <!-- 관리자용 건너뛰기 사용권 버튼 (활성화시 표시) -->
                <button id="quickSkipBtn" class="quick-skip-btn hidden">⚡ 단계를 즉시 건너뛰기</button>
            </div>

            <!-- 유리컵 캔버스 -->
            <div class="glass-cup-wrapper">
                <canvas id="gameCanvas" width="440" height="600"></canvas>
            </div>

            <!-- 방향키 조작 버튼 -->
            <div class="mobile-arrow-controls">
                <div class="arrow-row">
                    <button id="btnUp" class="arrow-btn">▲ 즉시 낙하 (위)</button>
                </div>
                <div class="arrow-row">
                    <button id="btnLeft" class="arrow-btn">◀ 왼쪽</button>
                    <button id="btnDown" class="arrow-btn">▼ 떨어뜨리기</button>
                    <button id="btnRight" class="arrow-btn">오른쪽 ▶</button>
                </div>
            </div>

            <footer class="controls-guide">
                <p>⌨️ <strong>조작법:</strong> 왼쪽(←) / 오른쪽(→) 이동 | 아래(↓) 낙하 | 위(↑) 즉시 낙하</p>
            </footer>
        </div>

        <!-- 3. 관리자 비밀번호 암호 모달 (비밀번호: 0222) -->
        <div id="adminModal" class="modal-overlay hidden">
            <div class="modal-card admin-card">
                <div class="result-icon">🔒</div>
                <h2>관리자 비밀권 인증</h2>
                <p>관리자 전용 비밀번호 4자리를 입력하세요.</p>

                <input type="password" id="adminPasswordInput" class="admin-input" placeholder="비밀번호 4자리" maxlength="4" autocomplete="off">
                <div id="adminMsg" class="admin-error-text"></div>

                <div class="modal-btn-group">
                    <button id="submitAdminBtn" class="btn primary-btn">비밀번호 확인 ✅</button>
                    <button id="closeAdminBtn" class="btn secondary-btn">취소</button>
                </div>
            </div>
        </div>

        <!-- 4. 결과 / 성공 / 실패 모달 -->
        <div id="resultModal" class="modal-overlay hidden">
            <div class="modal-card">
                <div id="resultIcon" class="result-icon">🎉</div>
                <h2 id="resultTitle">성공을 축하해요!</h2>
                <p id="resultMessage">단계 목표를 달성했습니다!</p>

                <!-- 기대효과: 두구두구두구두구 🥁 -->
                <div id="drumRollArea" class="drum-roll-text hidden">두구두구두구두구... 🥁</div>
                
                <div class="modal-score-box">
                    <span>최종 점수:</span>
                    <strong id="finalScoreText">0점</strong>
                </div>

                <div class="modal-btn-group">
                    <button id="retryBtn" class="btn secondary-btn">다시 하기</button>
                    <button id="nextStageBtn" class="btn primary-btn">다음 단계로 🚀</button>
                    <button id="homeBtn" class="btn tertiary-btn">홈으로</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
