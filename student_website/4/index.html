<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김도윤의 작품 - 버전 선택</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #e0f2f1 0%, #fce4ec 100%);
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-hover-bg: rgba(255, 255, 255, 0.7);
            --text-color: #2c3e50;
            --accent-color: #ec407a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0; min-height: 100vh;
            background: var(--primary-gradient);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        header, .container, footer { animation: fadeIn .8s ease-out forwards; }
        header { text-align: center; margin: 8vh 0 4vh; padding: 0 20px; }
        h1 {
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            margin: 0 0 .5rem; color: #1a2a3a; font-weight: 900;
            letter-spacing: -0.03em; text-shadow: 2px 2px 10px rgba(255,255,255,.3);
        }
        header p { font-size: clamp(1rem, 3vw, 1.2rem); color: #556b82; font-weight: 500; margin: 0; }
        .container {
            max-width: 900px; width: 90%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.25rem; margin-bottom: 8vh;
        }
        .ver-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 22px; aspect-ratio: 1/1; min-height: 120px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; padding: 10px; text-align: center;
            text-decoration: none; color: var(--text-color);
            transition: all .35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px 0 rgba(31,38,135,.05);
        }
        @media (hover: hover) {
            .ver-card:hover {
                transform: translateY(-8px) scale(1.04);
                background: var(--card-hover-bg);
                box-shadow: 0 18px 36px rgba(236,64,122,.18);
                border-color: rgba(255,255,255,.6);
            }
            .ver-card:hover .ver-num { color: var(--accent-color); }
        }
        .ver-card:active { transform: scale(0.97); }
        .ver-game { font-size: clamp(1rem, 2.9vw, 1.25rem); font-weight: 800; color: #556b82; line-height: 1.2; }
        .ver-num { font-size: clamp(.72rem, 2.4vw, .88rem); font-weight: 700; transition: color .3s ease; line-height: 1.1; }
        /* 연습(블록깨기) 카드 - 따뜻한 톤으로 구분 */
        .ver-card.practice { background: rgba(255, 236, 210, 0.55); border-color: rgba(255, 200, 140, 0.5); }
        .ver-card.practice .ver-game { color: #b26a00; }
        .ver-card.practice .ver-num { color: #d17c00; }
        @media (hover: hover) { .ver-card.practice:hover .ver-num { color: #b26a00; } }
        .badge {
            position: absolute; top: 10px; right: 10px;
            background: var(--accent-color); color: #fff;
            font-size: .62rem; font-weight: 700; letter-spacing: .5px;
            padding: 3px 8px; border-radius: 999px;
            box-shadow: 0 2px 8px rgba(236,64,122,.4);
        }
        .back {
            display: inline-block; margin-bottom: 6vh;
            padding: .8rem 1.8rem; border-radius: 999px;
            background: rgba(255,255,255,.55); color: #556b82;
            text-decoration: none; font-weight: 600; font-size: .95rem;
            border: 1px solid rgba(255,255,255,.4);
            transition: all .3s ease;
        }
        .back:hover { background: rgba(255,255,255,.85); transform: translateY(-2px); }
        footer { margin-top: auto; padding: 3rem 2rem; color: #7f8c8d; font-size: .9rem; font-weight: 500; text-align: center; }
        @media (max-width: 480px) {
            .container { grid-template-columns: repeat(2, 1fr); gap: .9rem; }
            .ver-card { border-radius: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>김도윤</h1>
        <p>버전을 눌러 작품을 실행해 보세요</p>
    </header>

    <main class="container">

        <a class="ver-card" href="./김도윤/v6/index.html">

        <a class="ver-card" href="./김도윤/v7/index.html">

        </a>
        <a class="ver-card" href="./김도윤/v8/index.html">
