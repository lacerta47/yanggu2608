<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티라노 공룡 달리기 게임 v4 - 아이템 대작전</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 상단 헤더 및 점수판 -->
        <header class="header">
            <h1 class="title">⚡🦖 티라노 공룡 달리기 v4</h1>
            <div class="scoreboard">
                <div class="score-box">현재 점수: <span id="currentScore">0</span>점</div>
                <div class="score-box high-score">최고 기록: <span id="highScore">0</span>점</div>
            </div>
            <!-- 활성화된 아이템 HUD 버프 바 -->
            <div id="activeItemHud" class="active-item-hud hidden">
                <span id="activeItemIcon" class="item-icon">⚡</span>
                <span id="activeItemName" class="item-name">속도 파워!</span>
                <div class="timer-bar-bg">
                    <div id="itemTimerBar" class="timer-bar-fill"></div>
                </div>
            </div>
        </header>

        <!-- 게임 캔버스 영역 -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="300"></canvas>

            <!-- 시작 안내 오버레이 -->
            <div id="startOverlay" class="overlay">
                <div class="start-box">
                    <div class="dino-icon">⚡ 🦖 🧲 🥛</div>
                    <h2>스페이스바(Space)를 누르면 시작합니다!</h2>
                    <p>🌵 점프: <strong>Space / ↑</strong> | 🦅 익룡 숙이기: <strong>B / ↓</strong></p>
                    <div class="item-guide">
                        <span>⚡ 속도 부스터</span>
                        <span>🧲 장애물 흡수 자석</span>
                        <span>🥛 무적 우유</span>
                    </div>
                </div>
            </div>

            <!-- 게임 결과 및 신기록 모달 -->
            <div id="resultModal" class="modal hidden">
                <div class="modal-content">
                    <div id="modalIcon" class="modal-icon">💥</div>
                    <h2 id="modalTitle" class="modal-title">게임 오버!</h2>
                    <p id="modalMessage" class="modal-message">장애물에 부딪혔어요!</p>
                    <div id="newRecordBadge" class="new-record-badge hidden">🎉 축하합니다! 신기록 달성! 🎉</div>
                    <button id="restartBtn" class="restart-btn">다시 시작하기 (Space) 🔄</button>
                </div>
            </div>
        </div>

        <!-- 모바일 터치조작 버튼 -->
        <div class="mobile-controls">
            <button id="jumpBtn" class="control-btn jump">🦘 점프 (Space)</button>
            <button id="slideBtn" class="control-btn slide">👇 숙이기 (B키)</button>
        </div>

        <!-- 키 및 아이템 설명 -->
        <footer class="footer">
            <p>💡 ⚡속도 업! | 🧲장애물 흡수 자석! | 🥛부딪혀도 끄떡없는 무적 우유 아이템을 먹어보세요!</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
